<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" style="background:#09090b;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stellarGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="400" fill="#09090b"/>
  <rect width="960" height="400" fill="url(#cyberGrid)"/>
  <rect width="960" height="400" fill="url(#heroGlow)"/>
  <rect width="960" height="400" fill="url(#leftGlow)"/>

  <!-- Left Side: Brand Typography & Metrics -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge: Live on Stellar -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.5">SOROBAN TESTNET LIVE</text>
      <rect x="186" y="6" width="54" height="16" rx="8" fill="#1e1b4b"/>
      <text x="194" y="17" fill="#818cf8" font-size="9" font-weight="800">STELLAR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1.5">
      Storm<tspan fill="url(#brandGradient)">Sale</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="180" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.5">
      STORM THE MARKET. BREAK THE PRICES.
    </text>

    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-size="14" font-weight="400" width="400">
      <tspan x="0" dy="0">Decentralized, non-custodial affiliate marketing and</tspan>
      <tspan x="0" dy="20">deterministic escrow clearing protocol on Stellar &amp; Soroban.</tspan>
    </text>

    <!-- Stats Badges Bar -->
    <g transform="translate(0, 275)">
      <!-- Box 1 -->
      <g>
        <rect width="125" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="26" fill="#38bdf8" font-size="16" font-weight="900">&lt; 1 sec</text>
        <text x="14" y="44" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.5">FINALITY</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(135, 0)">
        <rect width="125" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="26" fill="#34d399" font-size="16" font-weight="900">&lt; $0.0001</text>
        <text x="14" y="44" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.5">MICRO-FEES</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(270, 0)">
        <rect width="135" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="26" fill="#c084fc" font-size="16" font-weight="900">Non-Custodial</text>
        <text x="14" y="44" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.5">SOROBAN ESCROW</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Rotating Stellar Constellation Map / Globe -->
  <g transform="translate(680, 200)">
    <!-- Ambient Background Glow behind Globe -->
    <circle cx="0" cy="0" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

    <!-- Orbital Lat/Long Rings -->
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
    
    <!-- Longitude Ellipses -->
    <ellipse cx="0" cy="0" rx="135" ry="55" fill="none" stroke="#1e293b" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="55" ry="135" fill="none" stroke="#1e293b" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="135" ry="95" fill="none" stroke="#312e81" stroke-width="0.75" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="95" ry="135" fill="none" stroke="#312e81" stroke-width="0.75" opacity="0.8"/>

    <!-- Dynamic Constellation Network Rays (Africa & Global Nodes) -->
    <g filter="url(#glow)">
      <!-- Main Polygonal Data Backbone -->
      <polygon points="-20,-50 40,-20 15,45 -55,10" fill="none" stroke="#38bdf8" stroke-width="1.75" opacity="0.85"/>

      <!-- Cross Network Conduits -->
      <line x1="40" y1="-20" x2="95" y2="-45" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="15" y1="45" x2="65" y2="85" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="-55" y1="10" x2="-105" y2="-25" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="-20" y1="-50" x2="0" y2="-100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>

    <!-- Network Pulsing Nodes -->
    <!-- Central Node 1 (Pulsing Radar) -->
    <g transform="translate(-20, -50)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="4;16" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Central Node 2 (Stellar Node) -->
    <g transform="translate(40, -20)">
      <circle cx="0" cy="0" r="5" fill="#818cf8" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="5;18" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Central Node 3 (Soroban Escrow) -->
    <g transform="translate(15, 45)">
      <circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="6;22" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Central Node 4 -->
    <g transform="translate(-55, 10)">
      <circle cx="0" cy="0" r="4" fill="#34d399" filter="url(#nodeGlow)"/>
    </g>

    <!-- Outer Nodes -->
    <circle cx="95" cy="-45" r="3" fill="#64748b"/>
    <circle cx="65" cy="85" r="3.5" fill="#38bdf8"/>
    <circle cx="-105" cy="-25" r="3" fill="#64748b"/>
    <circle cx="0" cy="-100" r="3.5" fill="#818cf8"/>

    <!-- Floating HUD Overlay Card -->
    <g transform="translate(-100, 80)">
      <rect width="200" height="52" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#1e293b" stroke-width="1" filter="url(#glow)"/>
      <circle cx="20" cy="26" r="6" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="23" fill="#f8fafc" font-size="11" font-weight="800">Soroban Contract Executed</text>
      <text x="34" y="38" fill="#94a3b8" font-size="9" font-family="monospace">Tx: 8f2b...4e9a • 100% On-Chain</text>
    </g>
  </g>
</svg>
